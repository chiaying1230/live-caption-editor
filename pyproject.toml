[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "live-caption-editor"
version = "0.1.0"
description = "Local Traditional Chinese live caption workbench"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "faster-whisper>=1.2.1,<2",
  "numpy>=2.1,<3",
  "opencc-python-reimplemented>=0.1.7,<0.2",
  "av>=15,<17",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
funasr = ["funasr==1.4.19", "torch==2.10.0", "torchaudio==2.10.0", "soundfile>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["caption*"]

[tool.setuptools.package-data]
caption = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
